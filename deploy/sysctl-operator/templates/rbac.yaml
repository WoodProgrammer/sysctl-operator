{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sysctl-operator.fullname" . }}-manager
  labels:
    {{- include "sysctl-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [sysctl.k8s.io]
    resources: [scriptprofiles, sysctlprofiles]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [sysctl.k8s.io]
    resources: [scriptprofiles/finalizers, sysctlprofiles/finalizers]
    verbs: [update]
  - apiGroups: [sysctl.k8s.io]
    resources: [scriptprofiles/status, sysctlprofiles/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sysctl-operator.fullname" . }}-manager
  labels:
    {{- include "sysctl-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sysctl-operator.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "sysctl-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection.enabled }}
---
# Namespaced permissions for leader election (leases / events / configmaps).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sysctl-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sysctl-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sysctl-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sysctl-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sysctl-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "sysctl-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.secure }}
---
# Delegate authn/authz to the API server so the secure metrics endpoint can
# validate scraper tokens (TokenReview / SubjectAccessReview).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sysctl-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "sysctl-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "sysctl-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
