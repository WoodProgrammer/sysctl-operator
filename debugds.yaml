apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-dns-override
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: node-dns-override
  template:
    metadata:
      labels:
        app: node-dns-override
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: dns-override
          image: alpine:3.20
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              sleep 10000